spring:
  application:
    name: item-bank-api
  datasource:
    url: jdbc:mariadb://localhost:3306/itembank
    username: app
    password: app-pass
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: itembank-pool
      # 커넥션 풀 — 운영 값과 같게 맞춘다.
      # 풀이 작고 대기 시간이 짧아, 트랜잭션을 오래 쥐는 코드가 있으면 금방 고갈된다.
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
  tomcat:
    # 레거시(Apache + PHP)는 쿼리의 인코딩되지 않은 [ ] | { } 등을 받아 검색한다(search.php?q[]=… 등).
    # Tomcat 기본값은 이 문자들을 400 으로 거부하므로, Tomcat 이 허용할 수 있는 문자는 모두 허용한다.
    relaxed-query-chars: ['"', '<', '>', '[', '\', ']', '^', '`', '{', '|', '}']

logging:
  level:
    root: INFO
    com.example: INFO
